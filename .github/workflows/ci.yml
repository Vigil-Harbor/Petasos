name: CI

# Pull requests only. The master ruleset requires lint, typecheck and every test
# cell, on a branch that is up to date with master, so the tree a merge lands is
# the tree these jobs passed on. A run on the merge commit would repeat it.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same pull request replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each timeout-minutes is a billing stop about three times the slowest measured
# job, so a hang does not run to the six-hour default. It is not a test deadline.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned deliberately. An unpinned install silently adopts new formatter
      # behavior on release day and breaks every open branch at once (0.16.0
      # began formatting Python code blocks inside Markdown). Bump in its own PR.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy --strict .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The master ruleset requires each cell by its check name, `test (3.11)`
        # and so on. Change the ruleset together with this list, or a renamed
        # cell blocks every pull request.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # FastAPI is in the dev extra. The dashboard tests import it; Hermes
      # supplies it in a real install. There is no Node job: the tab's script
      # is tested from Python.
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short
