name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pinned deliberately. An unpinned install silently adopts new formatter
      # behavior on release day and breaks every open branch at once (0.16.0
      # began formatting Python code blocks inside Markdown). Bump in its own PR.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy --strict .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # FastAPI is in the dev extra. The dashboard tests import it; Hermes
      # supplies it in a real install. There is no Node job: the tab's script
      # is tested from Python.
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short
