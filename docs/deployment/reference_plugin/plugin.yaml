name: petasos
version: 1.0.0
description: "Content security pipeline — tool call guard, content scanning, session-aware escalation, audit"
hooks:
  - pre_tool_call
  - post_tool_call
  - on_session_start
  # PET-107: sub-agent (delegate_task) lineage. Registered defensively — if the
  # host build does not emit these, Petasos degrades to the fan-out gate (C)
  # only; lineage-linked escalation (A) no-ops.
  - subagent_start
  - subagent_stop
  # PET-170: ingestion-result scan seam. Fires after post_tool_call and before the result
  # reaches model context; a string return replaces the result. Petasos returns the content
  # WHOLE behind a warning banner, never withholding it. Documentation only, like every
  # other entry here: this file's hooks: list is what current Hermes stores as
  # provides_hooks when that key is absent. Runtime delivery remains ctx.register_hook
  # in register(). Declaring a name without registering it does not deliver callbacks.
  - transform_tool_result
  # PET-222: Hermes approval observers. Return values are ignored. Recorded even
  # while Petasos enforcement is disarmed.
  - pre_approval_request
  - post_approval_response
