[project]
name = "petasos-hermes-plugin"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    # Hermes locks every platform at once and torch has no Android wheel. Without the
    # marker that lock fails and Hermes disables this plugin on every platform.
    "petasos[presidio,prompt-guard]>=0.5.0; sys_platform != 'android'",
    "pyyaml==6.0.3",
    "en-core-web-lg",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
