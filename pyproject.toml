[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# PET-141: single version authority. Hatch reads __version__ from this file at
# build time, so petasos/__init__.py is the sole version literal in the repo.
path = "petasos/__init__.py"

[project]
name = "petasos"
# PET-141: version is derived from petasos/__init__.py via Hatch (see
# [tool.hatch.version]); no static literal here.
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vigil Harbor", email = "support@vigilharbor.com" }]
description = "Pluggable, session-aware content security pipeline for Python AI agents"
readme = "README.md"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://vigilharbor.com"
Repository = "https://github.com/Vigil-Harbor/Petasos"
Changelog = "https://github.com/Vigil-Harbor/Petasos/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Vigil-Harbor/Petasos/issues"

[project.scripts]
petasos = "petasos.cli:main"

[project.optional-dependencies]
# huggingface-hub 0.34 is the first with the `hf` command the docs and the scanner's
# error message name.
prompt-guard = [
    "torch>=2.6,<3",
    "transformers>=4.51,<6",
    "sentencepiece>=0.2,<1",
    "huggingface-hub>=0.34,<2",
]
presidio = [
    "presidio-analyzer>=2.2,<3.0",
    "presidio-anonymizer>=2.2,<3.0",
]
semgrep = ["psutil>=7,<8"]
all = ["petasos[presidio,prompt-guard]"]
dev = [
    # pytest-benchmark 5.3.0 reads node._nodeid, which pytest 9.2.0 removed. Lift the
    # cap once a pytest-benchmark release supports 9.2.
    "pytest>=8.0,<9.2",
    "pytest-benchmark>=5.0,<6",
    "pytest-cov>=5.0",
    "anyio[trio]>=4.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
    # The dashboard router imports FastAPI. Hermes supplies it in a real
    # install; the tests need it here. The standalone console's uvicorn
    # server is gone.
    "fastapi>=0.110,<1",
    "PyYAML>=6.0",
    # PET-106: the tests/test_ci_extras_lanes.py meta-test reads pyproject.toml;
    # `tomllib` is stdlib only on 3.11+. CI runs 3.11+ (native tomllib); the local
    # dev interpreter is 3.10, so backfill tomli there only.
    "tomli>=2.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
# PET-149: anyio's native auto-mode is the replacement for the removed
# `asyncio_mode = "auto"`. It binds every `async def test_*` to the anyio runner
# via anyio's early usefixtures("anyio_backend") collection path, which composes
# with `@pytest.mark.parametrize`, so no async test is silently collected but
# never awaited. The shared `anyio_backend` fixture (tests/conftest.py) pins it to
# function-scoped asyncio. Guarded by tests/test_async_marker_invariants.py.
anyio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
# The installed plugin directory is also named petasos. It is not a second copy of this package.
exclude = ["^hermes-plugin/"]

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer",
    "presidio_analyzer.*",
    "presidio_anonymizer",
    "presidio_anonymizer.*",
    "spacy",
    "spacy.*",
    "transformers",
    "transformers.*",
    "torch",
    "torch.*",
    "tokenizers",
    "tokenizers.*",
    "pytest_benchmark",
    "pytest_benchmark.*",
    "yaml",
    "yaml.*",
    "psutil",
    "psutil.*",
    # PET-106: tomli is the 3.10 fallback import in tests/test_ci_extras_lanes.py;
    # the sys.version_info guard already keeps mypy (pinned to 3.11) off that branch,
    # this override is belt-and-suspenders against a later refactor of the guard.
    "tomli",
    "tomli.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "petasos.scanners.presidio"
warn_unused_ignores = false
disallow_subclassing_any = false


